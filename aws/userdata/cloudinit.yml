#cloud-config

preserve_hostname: true
package_update: true
package_upgrade: true
apt:
  add_apt_repo_match: "universe"
packages:
  - git
  - software-properties-common
  - build-essential
  - zlib1g-dev
  - memcached
  - rustc
  - python3-pip
  - python3-dev
  - python3-mysqldb
  - python3-mysqldb-dbg
  - python3-pycurl
  - sqlite3
  - libsqlite3-dev
  - default-libmysqlclient-dev
  - nginx
  - fish
  - neovim
snap:
  commands:
    - snap install core
    - snap refresh core
    - snap install --classic certbot
ssh_authorized_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICYycDVwAK8ZTMk9pGlUJ8d1eK+Rc9eULII8e39AoVRm dm3@LVAGPLTP5340
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDNN9wOEZjF/I8akfVBDgQZZykFBDx/+w+3Zi1Lxy1Jx eddwardr@outlook.com
write_files:
  - path: /etc/systemd/system/rtb.service
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: |
      ${SERVICE}
  - path: /opt/bkp
    owner: root:root
    permissions: "0755"
    encoding: b64
    content: |
      ${BKP}
  - path: /etc/nginx/nginx.conf
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: |
      ${NGINX_CONF}
  - path: /etc/nginx/sites-enabled/RootTheBox.conf
    owner: root:root
    permissions: "0644"
    encoding: b64
    content: |
      ${RTB_NGINX}

